<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Frontend Mentor | Advice generator app</title>
  </head>
  <body>
    <main class="app">
      <section class="card" aria-live="polite">
        <p id="advice-id" class="advice-id">Advice #...</p>
        <blockquote id="advice-text" class="advice-text">Loading...</blockquote>

        <div class="divider" aria-hidden="true">
          <span class="divider-line"></span>
          <img class="divider-pattern mobile-divider" src="./images/pattern-divider-mobile.svg" alt="" />
          <img class="divider-pattern desktop-divider" src="./images/pattern-divider-desktop.svg" alt="" />
          <span class="divider-line"></span>
        </div>

        <button class="dice-button" type="button" aria-label="Generate a new advice">
          <img src="./images/icon-dice.svg" alt="" />
        </button>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
